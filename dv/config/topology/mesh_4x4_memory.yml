name: mesh_4x4_memory
description: "4x4 tiles with one subordinate-only west memory per row"
network_type: "axi"

routing:
  route_algo: "XY"
  use_id_table: true
  collective:
    en_narrow_multicast: true
    en_wide_multicast: true

endpoints:
  # Array member k holds coordinate (x, y) with k = (y << clog2(x_dim)) | x --
  # x is the fast axis, which is the order the packed SAM base uses.
  - name: "tile"
    array: [4, 4]
    mgr_port_protocol: ["axi"]           # presence marker: no protocols: block to resolve against
    sbr_port_protocol: ["axi"]           # required: is_sbr() gates SAM participation
    addr_range:
      - base: 0x0
        size: 0x2000000
        stride: 0x100000000              # node block stride, not the aperture
        space: memory
        en_collective: true
      - base: 0x2000000
        size: 0x1000
        stride: 0x100000000
        space: config
        en_collective: true
  - name: "memory"
    num: 4
    sbr_port_protocol: ["axi"]
    addr_range:
      - base: 0x1000000000
        size: 0x100000
        stride: 0x100000
        space: memory
routers:
  - name: "router"
    array: [4, 4]
    degree: 5
connections:
  - src: "tile"
    dst: "router"
    src_range: [[0, 3], [0, 3]]
    dst_range: [[0, 3], [0, 3]]
    dst_dir: 4
  - src: "memory"
    dst: "router"
    src_idx: [0, 1, 2, 3]
    dst_idx: [0, 4, 8, 12]
    dst_dir: 3
