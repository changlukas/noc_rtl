name: mesh_4x4

endpoints:
  - name: tile
    array: [4, 4]
    addr_range:
      - base: 0x0
        size: 0x2000000
        stride: 0x0001_0000_0000
        space: memory
        en_collective: true
      - base: 0x2000000
        size: 0x1000
        stride: 0x0001_0000_0000
        space: config
        en_collective: true

  # One external memory per row; four consecutive 1 MiB windows.
  - name: memory
    array: [4]
    addr_range:
      - base: 0x0010_0000_0000
        size: 0x0010_0000
        space: memory

routers:
  - array: [4, 4]

connections:
  - src: tile
    src_range: [[0, 3], [0, 3]]
    dst_range: [[0, 3], [0, 3]]
    dst_dir: Eject
  # memory[y] connects to the west port of router[0,y].
  - src: memory
    src_range: [[0, 3]]
    dst_range: [[0, 0], [0, 3]]
    dst_dir: West
